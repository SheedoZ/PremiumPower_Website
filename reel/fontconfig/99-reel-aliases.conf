<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The app requests Tahoma first for Arabic text; map it to the Arabic face we installed. -->
  <match target="pattern">
    <test name="family"><string>Tahoma</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans Arabic</string></edit>
  </match>
  <alias><family>Outfit</family><default><family>sans-serif</family></default></alias>
  <alias><family>Bebas Neue</family><default><family>sans-serif</family></default></alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Outfit</family><family>Noto Sans Arabic</family><family>DejaVu Sans</family></prefer>
  </alias>
</fontconfig>
